<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Royale Catch offers fresh, hygienically cleaned freshwater prawns ready to cook, with convenient weekend delivery.">
<meta name="keywords" content="fresh prawns, freshwater prawns, prawns delivery, cleaned prawns, ready to cook prawns, seafood delivery, fresh seafood, Royale Catch, prawn price, weekend seafood delivery">
<meta name="theme-color" content="#087f78">
<title>{% block title %}Auth{% endblock %}</title>
<style>
  :root {
    --bg: #ded9d0;
    --card: #ffffff;
    --accent: #d94a1e;
    --accent-dark: #b83a15;
    --text: #2a2620;
    --muted: #6f695f;
    --border: #d6d0c5;
    --error-bg: #fdecec;
    --error-text: #b91c1c;
    --success-bg: #eaf6ec;
    --success-text: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    padding: 24px;
  }
  .logo-badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2b6cb0, #1a365d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
  }
  .brand-heading {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-heading h2 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--text);
  }
  .brand-heading span {
    display: block;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 380px;
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h1 {
    margin: 0 0 4px;
    font-size: 22px;
    color: var(--text);
  }
  .card p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    background: #faf9f6;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 18px;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: #a39d90; }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-dark); }
  .switch {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: var(--muted);
  }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .switch a:hover { text-decoration: underline; }
  .messages { list-style: none; padding: 0; margin: 0 0 18px; }
  .messages li {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .messages li.error { background: var(--error-bg); color: var(--error-text); }
  .messages li.success { background: var(--success-bg); color: var(--success-text); }
  /* 2026 UI refresh */
  :root { --bg:#f5f7fb; --card:rgba(255,255,255,.92); --accent:#ef5b2a; --accent-dark:#cf4318; --text:#14213d; --muted:#6b7280; --border:#e6eaf0; }
  body { background: radial-gradient(circle at 15% 15%, rgba(14,165,233,.14), transparent 28%), radial-gradient(circle at 85% 80%, rgba(239,91,42,.14), transparent 30%), linear-gradient(135deg,#f8fafc,#eef6f8); position:relative; overflow-x:hidden; }
  body::before,body::after{content:"";position:fixed;border-radius:999px;filter:blur(1px);z-index:-1;opacity:.55}
  body::before{width:260px;height:260px;background:linear-gradient(135deg,#38bdf8,#0f766e);top:-100px;right:-70px}
  body::after{width:220px;height:220px;background:linear-gradient(135deg,#fb923c,#f43f5e);bottom:-100px;left:-70px}
  .brand-heading{margin-bottom:22px}.logo-badge{width:64px;height:64px;margin:0 auto 12px;background:linear-gradient(145deg,#0f766e,#0891b2);box-shadow:0 14px 32px rgba(8,145,178,.25)}
  .brand-heading h2{font-size:22px;font-weight:850;letter-spacing:1.6px}.brand-heading span{font-weight:800;color:#0f766e}
  .card{max-width:430px;padding:38px;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(15,23,42,.16)}
  .card h1{font-size:28px;letter-spacing:-.6px}.card p.subtitle{font-size:14px;margin-bottom:28px}
  label{font-size:12px;letter-spacing:.2px}input[type="text"],input[type="email"],input[type="password"]{padding:13px 14px;border-radius:12px;background:#f8fafc;border:1px solid #dfe5ec;margin-bottom:20px;box-shadow:inset 0 1px 2px rgba(15,23,42,.03)}
  input:focus{border-color:#0891b2!important;box-shadow:0 0 0 4px rgba(8,145,178,.1)}
  button{padding:13px;border-radius:12px;background:linear-gradient(135deg,#ef5b2a,#f97316);box-shadow:0 10px 24px rgba(239,91,42,.22);transition:.2s ease}button:hover{background:linear-gradient(135deg,#dc4b1d,#ea580c);transform:translateY(-1px)}
  .switch a{color:#0f766e}.messages li{border-radius:12px}
  @media(max-width:520px){body{padding:18px}.card{padding:28px 22px;border-radius:20px}}

</style>
</head>
<body>
  <div class="brand-heading">
    <div class="logo-badge">🦐</div>
    <h2>ROYALE CATCH</h2>
    <span>So good · So fresh</span>
  </div>
  <div class="card">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
